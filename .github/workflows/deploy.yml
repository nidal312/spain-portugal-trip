name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the Vite build to the `gh-pages` branch. GitHub Pages can stay on
# "Deploy from a branch" (gh-pages / root) — it does not need to be switched
# to GitHub Actions as the Pages source.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Disable Jekyll on Pages
        run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
